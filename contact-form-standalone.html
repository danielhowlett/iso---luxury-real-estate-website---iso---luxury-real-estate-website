<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HC Construction - Contact Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-2xl">
    <form id="contactForm" class="bg-white/5 rounded-3xl border border-white/20 backdrop-blur-2xl p-8 space-y-6">
      <h2 class="text-white text-3xl font-bold mb-8">Send Us a Message</h2>
      
      <div>
        <label for="name" class="block text-white text-sm font-medium mb-2">Your Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          required
          placeholder="John Doe"
          class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-white/50"
        >
      </div>

      <div>
        <label for="email" class="block text-white text-sm font-medium mb-2">Your Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required
          placeholder="john@example.com"
          class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-white/50"
        >
      </div>

      <div>
        <label for="message" class="block text-white text-sm font-medium mb-2">Your Message</label>
        <textarea 
          id="message" 
          name="message" 
          required
          rows="6"
          placeholder="Tell us about your project..."
          class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-white/50 resize-none"
        ></textarea>
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-white/20 hover:bg-white/30 text-white font-semibold py-4 px-6 rounded-lg transition-all duration-300 flex items-center justify-center gap-2"
      >
        <span id="btnText">Get a Free Quote</span>
        <svg id="btnArrow" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
        <svg id="btnSpinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>

      <div id="successMessage" class="hidden bg-green-500/20 border border-green-500/50 text-green-300 px-4 py-3 rounded-lg">
        Thank you! Your message has been sent successfully.
      </div>

      <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 text-red-300 px-4 py-3 rounded-lg">
        Sorry, there was an error sending your message. Please try again.
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnArrow = document.getElementById('btnArrow');
    const btnSpinner = document.getElementById('btnSpinner');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Hide any previous messages
      successMessage.classList.add('hidden');
      errorMessage.classList.add('hidden');
      
      // Disable button and show loading state
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
      btnText.textContent = 'Sending...';
      btnArrow.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
      
      // Get form data
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        // Submit to Google Apps Script
        await fetch('https://script.google.com/macros/s/AKfycbyNMg-VTxQbDeKZUDzkq0rMwzUyNw1IOqMLdtSlpqvdqcuw3fWcp5sIvVbRjuuQkhsw/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        // Show success message
        successMessage.classList.remove('hidden');
        
        // Clear form
        form.reset();
        
        // Auto-hide success message after 5 seconds
        setTimeout(() => {
          successMessage.classList.add('hidden');
        }, 5000);
        
      } catch (error) {
        console.error('Form submission error:', error);
        errorMessage.classList.remove('hidden');
        
        setTimeout(() => {
          errorMessage.classList.add('hidden');
        }, 5000);
      } finally {
        // Re-enable button
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        btnText.textContent = 'Get a Free Quote';
        btnArrow.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    });
  </script>

</body>
</html>
